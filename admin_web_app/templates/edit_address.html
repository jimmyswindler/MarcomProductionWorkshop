{% extends "base_v2.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card bg-dark border-secondary shadow">
            <div class="card-header border-secondary d-flex justify-content-between align-items-center py-3">
                <h1 class="h4 mb-0 text-white">Edit Address</h1>
                <span class="badge text-bg-info text-dark fs-6 font-monospace">Store #{{ addr.store_number }}</span>
            </div>
            
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Company Name (Canonical)</label>
                        <input type="text" name="company_name" class="form-control" value="{{ addr.company_name or '' }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-8">
                            <label class="form-label text-secondary fw-bold">Store Name (Geographic)</label>
                            <input type="text" name="store_name" class="form-control" value="{{ addr.store_name or '' }}">
                        </div>
                        <div class="col-4">
                            <label class="form-label text-secondary fw-bold">UPS Days</label>
                            <input type="number" name="ups_days" class="form-control" value="{{ addr.ups_days or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Attn</label>
                        <input type="text" name="attn" class="form-control" value="{{ addr.attn or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Address 1</label>
                        <input type="text" name="address1" class="form-control" value="{{ addr.address1 or '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Address 2</label>
                        <input type="text" name="address2" class="form-control" value="{{ addr.address2 or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Address 3</label>
                        <input type="text" name="address3" class="form-control" value="{{ addr.address3 or '' }}">
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-5">
                            <label class="form-label text-secondary fw-bold">City</label>
                            <input type="text" name="city" class="form-control" value="{{ addr.city or '' }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-secondary fw-bold">State</label>
                            <input type="text" name="state" class="form-control" value="{{ addr.state or '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-secondary fw-bold">Zip</label>
                            <input type="text" name="zip" class="form-control" value="{{ addr.zip or '' }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                        <a href="/address-book" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
