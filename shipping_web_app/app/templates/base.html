<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Station - Scanner Optimized</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <div id="sidebar-feed" class="sidebar">
        <div class="sidebar-header">
            <h3>Marcom Shipping App</h3>
            <ul id="system-status-list">
                <li><span id="status-db" class="indicator">●</span> Database</li>
                <li><span id="status-marcom" class="indicator">●</span> Marcom API</li>
                <li><span id="status-ups" class="indicator">●</span> UPS Worldship</li>
            </ul>
        </div>
        <div id="xml-feed-content">
            <ul id="live-feed-list"></ul>
        </div>
    </div>

    <div id="app">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}?v=restored"></script>
</body>

</html>
